services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forestproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forestproof
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestproof -d forestproof"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      DATABASE_URL: postgresql+psycopg2://forestproof:${POSTGRES_PASSWORD}@db:5432/forestproof
      ENVIRONMENT: production
      FORESTPROOF_ROOT: /repo
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      FORESTPROOF_ANALYST_PASSWORD: ${FORESTPROOF_ANALYST_PASSWORD:?set FORESTPROOF_ANALYST_PASSWORD in .env}
      FORESTPROOF_ADMIN_PASSWORD: ${FORESTPROOF_ADMIN_PASSWORD:?set FORESTPROOF_ADMIN_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
    volumes:
      - ./data:/repo/data:ro
      - api_runtime_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_runtime_data:
