version: "3.9"

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://forestproof:forestproof@db:5432/forestproof
      ENVIRONMENT: development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forestproof
      POSTGRES_PASSWORD: forestproof
      POSTGRES_DB: forestproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
