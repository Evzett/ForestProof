# Запуск: из КОРНЯ репозитория
#     docker compose -f api/docker-compose.yml up --build
#
# Контекст сборки — корень, а не api/: расчётное ядро, инструменты и
# описания набора лежат там, и без них API не посчитает ничего.

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://forestproof:forestproof@db:5432/forestproof
      ENVIRONMENT: development
      FORESTPROOF_ROOT: /repo
      # Секрет подписи токенов и пароли учётных записей — из окружения,
      # не из репозитория (KAN-78). Локально можно оставить пустыми.
      AUTH_SECRET: ${AUTH_SECRET:-}
      FORESTPROOF_OPERATOR_PASSWORD: ${FORESTPROOF_OPERATOR_PASSWORD:-}
      FORESTPROOF_INVESTOR_PASSWORD: ${FORESTPROOF_INVESTOR_PASSWORD:-}
      FORESTPROOF_ADMIN_PASSWORD: ${FORESTPROOF_ADMIN_PASSWORD:-}
      # Демонстрационный режим: сервис открывается администратором без
      # входа. Выключается значением 0 и не действует при
      # ENVIRONMENT=production ни при каком значении.
      FORESTPROOF_OPEN_ADMIN: ${FORESTPROOF_OPEN_ADMIN:-1}
      # Токен Earthdata для продукта гарей MODIS. Без него гари просто
      # не ищутся — расчёт от этого не падает.
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      # Ключ языковой модели для краткой справки. Пустой — штатное
      # состояние: справка собирается шаблоном, сервис работает.
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      ROUTERAI_MODEL: ${ROUTERAI_MODEL:-}
      ROUTERAI_BASE_URL: ${ROUTERAI_BASE_URL:-https://routerai.ru/api/v1}
    volumes:
      # Код — живьём, чтобы --reload имел смысл.
      - .:/app
      - ../forestproof_core:/repo/forestproof_core
      - ../tools:/repo/tools
      # Растры набора (44 МБ) и кэш скачанного: томом, а не в образе.
      - ../data:/repo/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forestproof
      POSTGRES_PASSWORD: forestproof
      POSTGRES_DB: forestproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
