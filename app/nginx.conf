server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /data/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Файлы сборки: имя содержит хеш содержимого, поэтому их можно
    # кэшировать навсегда — изменившийся файл получит другое имя.
    #
    # `=404` вместо отката на index.html принципиально. С общим откатом
    # отсутствующий скрипт отдавался страницей: браузер получал HTML там,
    # где ждал модуль, отказывался его выполнять, и вкладка оставалась
    # пустой без единой понятной ошибки. Ровно это и происходило после
    # пересборки у тех, чей браузер держал в кэше прежний index.html.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Сама страница не кэшируется никогда. Она весит килобайт и ссылается
    # на файлы по хешам; закэшированная, она переживает пересборку и
    # продолжает просить файлы, которых больше нет.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
